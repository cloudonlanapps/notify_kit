[project]
name = "notify-kit-example-server"
version = "0.1.0"
description = "FastAPI manual exercise server for notify-kit"
requires-python = ">=3.12"
dependencies = [
    "notify-kit",
    "fastapi>=0.135.1,<1",
    "pydantic[email]>=2.12.5,<3",
    "uvicorn>=0.41,<1",
    "httpx>=0.28.1,<1",
]

[tool.uv.sources]
notify-kit = { path = "../..", editable = true }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.optional-dependencies]
postgres = ["notify-kit[postgres]"]

[tool.basedpyright]
include = ["app"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = [".", "../../src"]

[tool.ruff.lint.isort]
known-third-party = ["alembic", "notify_kit"]
